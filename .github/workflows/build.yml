name: "Create DD image"
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bios-init
            runner: ubuntu-latest
          - name: amd-init
            runner: ubuntu-latest
          - name: arm-init
            runner: ubuntu-26.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@master
    - uses: DeterminateSystems/nix-installer-action@main

    - name: Configure OCI and rclone
      run: |
        mkdir ~/.oci
        echo "${{ secrets.OCI_CONFIG }}" > ~/.oci/config
        echo "${{ secrets.OCI_API_KEY}}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

    - name: System Build
      # https://github.com/chainguard-dev/melange/issues/1508
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        outPath=$(nix build --no-link --print-out-paths .#nixosConfigurations.${{ matrix.name }}.config.system.build.image)
        echo "outPath=$outPath" >> "$GITHUB_ENV"

    - run: nix profile add nixpkgs#rclone
    - run: rclone -v copy $outPath/${{ matrix.name }}.raw oracle:us